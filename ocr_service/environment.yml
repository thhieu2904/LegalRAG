# OCR Microservice Conda Environment
# Independent environment for Vietnamese CCCD OCR processing

name: ocr-microservice
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # Python
  - python=3.11

  # Core web framework
  - fastapi>=0.104.0
  - uvicorn>=0.24.0
  - python-multipart>=0.0.5

  # Data validation
  - pydantic>=2.5.0
  - pydantic-settings>=2.1.0

  # Redis and caching
  - redis-py>=4.5.0

  # Image processing and computer vision
  - opencv>=4.8.0
  - pillow>=9.5.0
  - numpy>=1.24.0

  # CPU-optimized PyTorch (no GPU needed for OCR)
  - pytorch::pytorch-cpu>=2.0.0
  - pytorch::torchvision-cpu>=0.15.0

  # ML and NLP
  - transformers>=4.30.0
  - scikit-learn>=1.3.0

  # Text processing
  - regex>=2023.8.8

  # Utilities
  - python-dotenv>=1.0.0
  - click>=8.1.0
  - rich>=13.0.0

  # HTTP client
  - httpx>=0.24.0
  - aiofiles>=23.0.0

  # System monitoring
  - psutil>=5.9.0

  # Development tools
  - pytest>=7.0.0
  - black>=23.0.0
  - isort>=5.12.0

  # Additional packages via pip
  - pip
  - pip:
      # Vietnamese OCR engine
      - vietocr>=0.3.10
      # Async Redis
      - aioredis>=2.0.0
      # Text processing
      - unidecode>=1.3.0
      - langdetect>=1.0.9
      # Security
      - python-jose[cryptography]>=3.3.0
      - passlib[bcrypt]>=1.7.4
      # Performance
      - orjson>=3.9.0
      # Date handling
      - python-dateutil>=2.8.0
