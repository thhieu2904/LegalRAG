# Isolated form/QR stack. Real decoder/Word/router; read-only local template store.
name: legalrag-form-dev

services:
  storage-service:
    image: legalrag-form-dev-storage:dev
    build:
      context: ./storage-service
    # Dev-only entry point, deliberately not the production MinIO app.
    command: ['uvicorn', 'src.form_dev:app', '--host', '0.0.0.0', '--port', '8010', '--reload', '--reload-dir', '/app/src']
    ports:
      - '127.0.0.1:18010:8010'
    volumes:
      - ./storage-service:/app:ro
      - './thesis/refs/forms/Giấy đăng ký khai sinh.docx:/templates/birth.docx:ro'
    healthcheck:
      test: ['CMD', 'python', '-c', "import httpx; r=httpx.get('http://127.0.0.1:8010/health'); r.raise_for_status(); assert r.json()['storage_connected']"]
      interval: 5s
      timeout: 5s
      retries: 15

  form-service:
    image: legalrag-form-dev-form:dev
    build:
      context: ./form-service
    command: ['python', '-m', 'uvicorn', 'main:app', '--host', '0.0.0.0', '--port', '8015', '--reload', '--reload-dir', '/app']
    environment:
      STORAGE_SERVICE_URL: http://storage-service:8010
      STORAGE_TIMEOUT: '30'
      LOG_LEVEL: INFO
    ports:
      - '127.0.0.1:18015:8015'
    volumes:
      - ./form-service:/app:ro
      - './thesis/refs/forms/Giấy đăng ký khai sinh.docx:/test-templates/birth.docx:ro'
    depends_on:
      storage-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import httpx; r=httpx.get('http://127.0.0.1:8015/health'); r.raise_for_status(); assert r.json()['storage_service']=='healthy'"]
      interval: 5s
      timeout: 8s
      retries: 15

  query-service:
    image: legalrag-form-dev-query:dev
    build:
      context: ./query-service
    # Uses the production forms router, without starting the RAG/DB application.
    command: ['uvicorn', 'src.forms_dev:app', '--host', '0.0.0.0', '--port', '8002', '--reload', '--reload-dir', '/app/src']
    environment:
      FORM_SERVICE_URL: http://form-service:8015
      STORAGE_SERVICE_URL: http://storage-service:8010
    ports:
      - '127.0.0.1:18002:8002'
    volumes:
      - ./query-service:/app:ro
    depends_on:
      form-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import httpx; r=httpx.get('http://127.0.0.1:8002/health'); r.raise_for_status(); assert r.json()['mode']=='form-dev'"]
      interval: 5s
      timeout: 5s
      retries: 15
