name: voice_rag_service
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.4.0
  - torchaudio=2.4.0
  - pytorch-cuda=12.4
  - pip
  - pip:
      - fastapi==0.115.0
      - uvicorn[standard]==0.32.0
      - soundfile==0.12.1
    - transformers==4.44.0
    - cached-path==1.8.0
      - omegaconf==2.3.0
    - vocos==0.1.0
      - pydub==0.25.1
      - librosa==0.10.1
    - huggingface-hub>=0.35.3
    - matplotlib==3.10.7
    - tqdm==4.67.1
    - torchdiffeq==0.2.5
    - x-transformers==2.8.4
    - jieba==0.42.1
    - pypinyin==0.55.0
    - wandb==0.22.2
  # Optional Piper (external exe) envs for offline Vietnamese fallback:
  # - Set PIPER_EXE to path of piper executable
  # - Set PIPER_MODEL to path of Vietnamese voice .onnx
  # - (Optional) PIPER_CONFIG to corresponding .json
