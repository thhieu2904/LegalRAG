# Use AFTER the server's EXISTING production Compose file, never on its own.
# Absolute contexts allow the existing Compose/env to stay outside this clone.
# No data volumes, provider selection, dependencies or service ports are changed.
services:
  frontend:
    image: legalrag-source/frontend:${LEGALRAG_SOURCE_TAG:?Set LEGALRAG_SOURCE_TAG}
    pull_policy: never
    build:
      context: ${LEGALRAG_SOURCE_ROOT:?Set LEGALRAG_SOURCE_ROOT}/frontend
      dockerfile: Dockerfile
    # Nginx listens on IPv4; Alpine wget can resolve localhost to ::1 first.
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/']

  query-service:
    image: legalrag-source/query:${LEGALRAG_SOURCE_TAG:?Set LEGALRAG_SOURCE_TAG}
    pull_policy: never
    build:
      context: ${LEGALRAG_SOURCE_ROOT:?Set LEGALRAG_SOURCE_ROOT}/query-service
      dockerfile: Dockerfile
    # python:slim has httpx from requirements, but no curl binary.
    healthcheck:
      test: ['CMD', 'python', '-c', "import os,httpx; httpx.get('http://127.0.0.1:'+os.getenv('SERVICE_PORT','8002')+'/health',timeout=5).raise_for_status()"]

  form-service:
    image: legalrag-source/form:${LEGALRAG_SOURCE_TAG:?Set LEGALRAG_SOURCE_TAG}
    pull_policy: never
    build:
      context: ${LEGALRAG_SOURCE_ROOT:?Set LEGALRAG_SOURCE_ROOT}/form-service
      dockerfile: Dockerfile
