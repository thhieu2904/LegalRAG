name: legalrag
services:
  # Frontend Service - Production
  frontend:
    container_name: legalrag-frontend
    image: thhieu/legalrag-frontend:v0.1
    ports:
      - "5173:5173"
    depends_on:
      - rag-service
      - identifill-service
    networks:
      - legalrag-network

  # RAG Service with GPU Support - Production
  rag-service:
    container_name: legalrag-rag-service
    image: thhieu/legalrag-rag-service:v0.1
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - HF_CACHE_DIR=/app/data/models/hf_cache
      - CUDA_VISIBLE_DEVICES=0
      - ENVIRONMENT=docker
      - LEGALRAG_BASE_PATH=/app
      - LEGALRAG_DATA_PATH=/app/data
    volumes:
      # Named volume để lưu models - không mất khi down/up
      - rag_models:/app/data/models
    # volumes:
    # - ../rag_service/data:/app/data  # REMOVED: Use embedded data in image
    # - ./.env:/app/.env  # REMOVED: Use built-in config
    networks:
      - legalrag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Identifill Service (CCCD Scanner) - Production
  identifill-service:
    container_name: legalrag-identifill-service
    image: thhieu/legalrag-identifill-service:v0.1
    ports:
      - "8002:8002"
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=docker
      - RAG_SERVICE_URL=http://rag-service:8000
    # volumes:
    # - ../identifill_service/models:/app/models  # Use image-embedded models
    networks:
      - legalrag-network

volumes:
  # Named volume để persistent models - không mất khi down/up
  rag_models:

networks:
  legalrag-network:
