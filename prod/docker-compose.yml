# ============================================================================
# LegalRAG Production - Microservices Architecture (9 Services)
# ============================================================================
# Deploy: docker compose pull && docker compose up -d
#
# ARCHITECTURE:
#   Frontend (3000) → Query Service (8002) → Internal Services (801X)
#   Admin UI (8001) → Storage/Vector/Embedding Services
#
# INFRASTRUCTURE (in this compose):
#   - PostgreSQL pgvector (5432)
#   - MinIO S3 (9000/9001)
#
# ML SERVICES (GPU enabled):
#   - Embedding Service (8011) - Vietnamese Embedding model
#   - Rerank Service (8013) - BGE Reranker v2-m3
#   - LLM Service (8014) - Vistral-7B Q4 GGUF
#
# NOTE: Models are NOT included in images. They auto-download on first startup.
#       Mount HuggingFace cache volume to persist models across restarts.
# ============================================================================

name: legalrag

volumes:
  # Data persistence
  minio_data:
    driver: local
  postgres_data:
    driver: local

  # ML Models cache (shared across services, auto-download from HuggingFace)
  huggingface_cache:
    driver: local
  llm_models:
    driver: local

networks:
  legalrag-network:
    driver: bridge

services:
  # ============= DATA LAYER =============

  # MinIO - S3-compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: legalrag-minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - legalrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legalrag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legalrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalrag123}
      POSTGRES_DB: ${POSTGRES_DB:-legalrag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Mount init script for fresh deploy (comment out if restoring from dump)
      # - ./init.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - legalrag-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-legalrag} -d ${POSTGRES_DB:-legalrag}",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============= CORE SERVICES (API Layer) =============

  # Storage Service - MinIO wrapper for file operations
  storage-service:
    image: ${DOCKERHUB_USER}/legalrag-storage:${IMAGE_TAG:-latest}
    container_name: legalrag-storage
    ports:
      - "8010:8010"
    environment:
      SERVICE_NAME: storage-service
      SERVICE_PORT: "8010"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_SECURE: "false"
      MINIO_BUCKET: legal-documents
      VECTOR_SERVICE_URL: http://vector-service:8012
      EMBEDDING_SERVICE_URL: http://embedding-service:8011
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - legalrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Vector Service - PostgreSQL pgvector operations
  vector-service:
    image: ${DOCKERHUB_USER}/legalrag-vector:${IMAGE_TAG:-latest}
    container_name: legalrag-vector
    ports:
      - "8012:8012"
    environment:
      SERVICE_NAME: vector-service
      SERVICE_PORT: "8012"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-legalrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalrag123}
      POSTGRES_DB: ${POSTGRES_DB:-legalrag}
      EMBEDDING_DIMENSION: "768"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - legalrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============= ML SERVICES (GPU Enabled) =============

  # Embedding Service - Vietnamese Document Embedding (GPU)
  embedding-service:
    image: ${DOCKERHUB_USER}/legalrag-embedding:${IMAGE_TAG:-latest}
    container_name: legalrag-embedding
    ports:
      - "8011:8011"
    environment:
      SERVICE_NAME: embedding-service
      SERVICE_PORT: "8011"
      MODEL_NAME: dangvantuan/vietnamese-document-embedding
      MODEL_CACHE_DIR: /app/models
      DEVICE: cuda
      MAX_SEQ_LENGTH: "8192"
      BATCH_SIZE: "32"
      EMBEDDING_DIMENSION: "768"
      GPU_SWAP_MODE: "false"
      # HuggingFace cache
      HF_HOME: /app/models
      TRANSFORMERS_CACHE: /app/models
    volumes:
      - huggingface_cache:/app/models
    networks:
      - legalrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Rerank Service - BGE Reranker v2-m3 (GPU)
  rerank-service:
    image: ${DOCKERHUB_USER}/legalrag-rerank:${IMAGE_TAG:-latest}
    container_name: legalrag-rerank
    ports:
      - "8013:8013"
    environment:
      SERVICE_NAME: rerank-service
      SERVICE_PORT: "8013"
      MODEL_NAME: BAAI/bge-reranker-v2-m3
      MODEL_CACHE_DIR: /app/models
      MODEL_MAX_LENGTH: "1024"
      DEVICE: cuda
      GPU_SWAP_MODE: "false"
      BATCH_SIZE: "32"
      TOP_K: "5"
      API_KEY_ENABLED: "false"
      LOG_LEVEL: INFO
      # HuggingFace cache
      HF_HOME: /app/models
      TRANSFORMERS_CACHE: /app/models
    volumes:
      - huggingface_cache:/app/models
    networks:
      - legalrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # LLM Service - Vistral-7B-Chat Q4 with GPU acceleration
  llm-service:
    image: ${DOCKERHUB_USER}/legalrag-llm:${IMAGE_TAG:-latest}
    container_name: legalrag-llm
    ports:
      - "8014:8014"
    environment:
      SERVICE_NAME: llm-service
      SERVICE_PORT: "8014"
      SERVICE_HOST: "0.0.0.0"
      # Model config - auto-download from HuggingFace
      MODEL_NAME: ggml-vistral-7B-chat-q4_0.gguf
      MODEL_PATH: /app/models/ggml-vistral-7B-chat-q4_0.gguf
      MODEL_CACHE_DIR: /app/models
      HF_MODEL_REPO: uonlp/Vistral-7B-Chat-gguf
      HF_MODEL_FILE: ggml-vistral-7B-chat-q4_0.gguf
      # llama.cpp config
      N_CTX: "8192"
      N_GPU_LAYERS: "-1"
      N_THREADS: "4"
      N_BATCH: "512"
      # Generation parameters
      MAX_TOKENS: "2048"
      TEMPERATURE: "0.7"
      TOP_P: "0.9"
      TOP_K: "40"
      REPEAT_PENALTY: "1.1"
      # Hardware
      DEVICE: cuda
      USE_MMAP: "true"
      USE_MLOCK: "false"
      VERBOSE: "false"
      LOG_LEVEL: INFO
    volumes:
      - llm_models:/app/models
    networks:
      - legalrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8014/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============= APPLICATION SERVICES =============

  # Form Service - Form processing (fill templates, render HTML)
  form-service:
    image: ${DOCKERHUB_USER}/legalrag-form:${IMAGE_TAG:-latest}
    container_name: legalrag-form
    ports:
      - "8015:8015"
    environment:
      SERVICE_NAME: form-service
      SERVICE_PORT: "8015"
      SERVICE_HOST: "0.0.0.0"
      STORAGE_SERVICE_URL: http://storage-service:8010
      STORAGE_TIMEOUT: "30"
      LOG_LEVEL: INFO
    depends_on:
      - storage-service
    networks:
      - legalrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Query Service - RAG orchestrator (User-facing Q&A)
  query-service:
    image: ${DOCKERHUB_USER}/legalrag-query:${IMAGE_TAG:-latest}
    container_name: legalrag-query
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: query-service
      SERVICE_PORT: "8002"
      # Internal service URLs
      EMBEDDING_SERVICE_URL: http://embedding-service:8011
      VECTOR_SERVICE_URL: http://vector-service:8012
      RERANK_SERVICE_URL: http://rerank-service:8013
      LLM_SERVICE_URL: http://llm-service:8014
      STORAGE_SERVICE_URL: http://storage-service:8010
      FORM_SERVICE_URL: http://form-service:8015
      # GPU swap disabled (all on GPU)
      GPU_SWAP_MODE: "false"
      # Search parameters
      TOP_K: "10"
      SIMILARITY_THRESHOLD: "0.5"
      RERANK_TOP_K: "10"
      RERANK_THRESHOLD: "0.6"
      # PostgreSQL (for metadata queries)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-legalrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalrag123}
      POSTGRES_DB: ${POSTGRES_DB:-legalrag}
    depends_on:
      - embedding-service
      - vector-service
      - storage-service
      - llm-service
      - rerank-service
      - form-service
    networks:
      - legalrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Admin Service - Document management & ingestion
  admin-service:
    image: ${DOCKERHUB_USER}/legalrag-admin:${IMAGE_TAG:-latest}
    container_name: legalrag-admin
    ports:
      - "8001:8001"
    environment:
      SERVICE_NAME: admin-service
      SERVICE_PORT: "8001"
      # Internal service URLs
      STORAGE_SERVICE_URL: http://storage-service:8010
      EMBEDDING_SERVICE_URL: http://embedding-service:8011
      VECTOR_SERVICE_URL: http://vector-service:8012
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-legalrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalrag123}
      POSTGRES_DB: ${POSTGRES_DB:-legalrag}
    depends_on:
      storage-service:
        condition: service_started
      embedding-service:
        condition: service_started
      vector-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - legalrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============= FRONTEND =============

  # Frontend - React application
  frontend:
    image: ${DOCKERHUB_USER}/legalrag-frontend:${IMAGE_TAG:-latest}
    container_name: legalrag-frontend
    ports:
      - "3000:3000"
    environment:
      # These are build-time variables baked into the image
      # For runtime config, use nginx env substitution or .env.production
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
      VITE_QUERY_SERVICE_URL: ${VITE_QUERY_SERVICE_URL:-http://localhost:8002}
      VITE_APP_TITLE: LegalRAG System
    depends_on:
      - query-service
      - admin-service
    networks:
      - legalrag-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
# ============================================================================
# DEPLOYMENT NOTES
# ============================================================================
# 1. Copy .env file to server alongside docker-compose.yml
# 2. Pull all images: docker compose pull
# 3. Start stack: docker compose up -d
# 4. Check logs: docker compose logs -f
#
# FIRST TIME SETUP:
# - Models will auto-download on first startup (may take 10-30 minutes)
# - Database needs to be restored from dump (see DATABASE RESTORE below)
# - MinIO bucket "legal-documents" needs to be created
#
# DATABASE RESTORE:
#   docker exec -i legalrag-postgres psql -U legalrag -d legalrag < backup.sql
#
# MINIO BUCKET SETUP:
#   docker exec legalrag-minio mc alias set local http://localhost:9000 minioadmin minioadmin123
#   docker exec legalrag-minio mc mb local/legal-documents
#
# UPDATE SINGLE SERVICE:
#   docker compose pull admin-service
#   docker compose up -d admin-service
#
# VIEW LOGS:
#   docker compose logs -f embedding-service
#
# PORT MAPPING SUMMARY:
#   Infrastructure:
#     - MinIO API:       9000
#     - MinIO Console:   9001
#     - PostgreSQL:      5432
#   User-facing:
#     - Frontend:        3000
#     - Admin API:       8001
#     - Query API:       8002
#   Internal:
#     - Storage:         8010
#     - Embedding:       8011
#     - Vector:          8012
#     - Rerank:          8013
#     - LLM:             8014
#     - Form:            8015
# ============================================================================
