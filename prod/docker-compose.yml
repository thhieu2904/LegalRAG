name: legalrag
services:
  # Frontend Service - Production
  frontend:
    container_name: legalrag-frontend
    image: thhieu/legalrag-frontend:v1.0.2
    ports:
      - "5173:5173"
    depends_on:
      - rag-service
      - identifill-service
      - admin-service
    networks:
      - legalrag-network

  # RAG Service with GPU Support - Production
  rag-service:
    container_name: legalrag-rag-service
    image: thhieu/legalrag-rag-service:v1.0.2
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - HF_CACHE_DIR=/app/data/models/hf_cache
      - CUDA_VISIBLE_DEVICES=0
      - ENVIRONMENT=docker
      - LEGALRAG_BASE_PATH=/app
      - LEGALRAG_DATA_PATH=/app/data
      - CUDA_MPS_PIPE_DIRECTORY=/tmp/nvidia-mps
    volumes:
      # Named volume để lưu toàn bộ data - models, storage, cache
      - rag_data:/app/data
    # volumes:
    # - ../rag_service/data:/app/data  # REMOVED: Use embedded data in image
    # - ./.env:/app/.env  # REMOVED: Use built-in config
    networks:
      - legalrag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
        limits:
          memory: 10G

  # Identifill Service (CCCD Scanner) - Production
  identifill-service:
    container_name: legalrag-identifill-service
    image: thhieu/legalrag-identifill-service:v1.0.2
    ports:
      - "8002:8002"
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=docker
      - RAG_SERVICE_URL=http://rag-service:8000
    # volumes:
    # - ../identifill_service/models:/app/models  # Use image-embedded models
    networks:
      - legalrag-network

  # Admin Service - Production
  admin-service:
    container_name: legalrag-admin-service
    image: thhieu/legalrag-admin-service:v1.0.2
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=docker
      - RAG_SERVICE_URL=http://rag-service:8000
    volumes:
      # Shared data volume with RAG service for direct storage access
      - rag_data:/app/data
    networks:
      - legalrag-network

volumes:
  # Named volume để persistent toàn bộ data - models, storage, cache
  rag_data:

networks:
  legalrag-network:
