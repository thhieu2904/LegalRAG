version: "3.8"

# ============================================
# LegalRAG Data Import Service
# ============================================
# This compose file adds a data import service that:
# 1. Converts .doc files to PDF using LibreOffice
# 2. Uploads PDFs to MinIO
# 3. Creates collections and documents in PostgreSQL
#
# Usage:
#   1. Copy your data to scripts/data_import/input/
#   2. Run: docker compose -f docker-compose.import.yml up --build
#   3. Check logs for results
# ============================================

services:
  data-import:
    build:
      context: ./scripts/data_import
      dockerfile: Dockerfile.converter
    container_name: legalrag-import
    environment:
      # PostgreSQL
      POSTGRES_HOST: legalrag-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: legalrag
      POSTGRES_USER: legalrag
      POSTGRES_PASSWORD: legalrag123

      # MinIO
      MINIO_ENDPOINT: legalrag-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_SECURE: "false"
      MINIO_BUCKET: legal-documents

      # Paths
      INPUT_DIR: /app/input
      OUTPUT_DIR: /app/output
      MAPPING_FILE: /app/collections_mapping.json
      LOG_DIR: /app/logs
    volumes:
      # Mount input data folder
      - "./docs/Văn bản pháp luật:/app/input:ro"
      # Output folder for converted PDFs
      - "./scripts/data_import/output:/app/output"
      # Logs
      - "./scripts/data_import/logs:/app/logs"
    networks:
      - legalrag_legalrag-network

networks:
  legalrag_legalrag-network:
    external: true
