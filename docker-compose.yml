version: "3.8"

# ============================================
# LegalRAG - Microservices Architecture
# ============================================
# Simple version: Direct port exposure (no Kong Gateway)
# Each service has its own port for easy development & testing
#
# Architecture:
#   Frontend (3000) → Services (8001-8007)
#   Services → MinIO (9000) + PostgreSQL (5432)
#
# To start: docker compose up --build
# ============================================

services:
  # ============= DATA LAYER =============

  # MinIO - S3-compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: legalrag-minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - legalrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # PostgreSQL with pgvector extension
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: legalrag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: legalrag
      POSTGRES_PASSWORD: legalrag123
      POSTGRES_DB: legalrag
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_new.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - legalrag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalrag -d legalrag"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============= APPLICATION LAYER =============

  # Storage Service - MinIO wrapper for file operations
  storage-service:
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    container_name: legalrag-storage
    ports:
      - "8010:8010"
    environment:
      SERVICE_NAME: storage-service
      SERVICE_PORT: 8010
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_SECURE: "false"
      MINIO_BUCKET: legal-documents
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - legalrag-network
    volumes:
      - ./storage-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Vector Service - PostgreSQL pgvector operations
  vector-service:
    build:
      context: ./vector-service
      dockerfile: Dockerfile
    container_name: legalrag-vector
    ports:
      - "8012:8012"
    environment:
      SERVICE_NAME: vector-service
      SERVICE_PORT: 8012
      POSTGRES_HOST: postgres-vector
      POSTGRES_PORT: 5432
      POSTGRES_USER: legalrag
      POSTGRES_PASSWORD: legalrag123
      POSTGRES_DB: legalrag
    depends_on:
      postgres-vector:
        condition: service_healthy
    networks:
      - legalrag-network
    volumes:
      - ./vector-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Embedding Service - Local sentence-transformers model
  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: legalrag-embedding
    ports:
      - "8011:8011"
    environment:
      SERVICE_NAME: embedding-service
      SERVICE_PORT: 8011
      MODEL_NAME: dangvantuan/vietnamese-document-embedding
      MODEL_CACHE_DIR: /app/models
      DEVICE: cpu # Change to 'cuda' if GPU available
      MAX_SEQ_LENGTH: 8192
      BATCH_SIZE: 32
      EMBEDDING_DIMENSION: 768
      CHUNK_SIZE: 600
      CHUNK_OVERLAP: 100
      ADMIN_API_KEY: admin-secret-key-change-in-production
    networks:
      - legalrag-network
    volumes:
      - ./embedding-service:/app
      - embedding_models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 60s
      timeout: 30s
      retries: 3
    restart: unless-stopped
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Rerank Service - BGE Reranker v2-m3 for relevance scoring
  rerank-service:
    build:
      context: ./rerank-service
      dockerfile: Dockerfile
    container_name: legalrag-rerank
    ports:
      - "8013:8013"
    environment:
      SERVICE_NAME: rerank-service
      SERVICE_PORT: 8013
      MODEL_NAME: BAAI/bge-reranker-v2-m3
      MODEL_CACHE_DIR: /app/models
      MODEL_MAX_LENGTH: 1024
      DEVICE: cpu
      BATCH_SIZE: 32
      TOP_K: 5
      API_KEY_ENABLED: "false"
      LOG_LEVEL: INFO
    networks:
      - legalrag-network
    volumes:
      - ./rerank-service:/app
      - rerank_models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # LLM Service - Vistral-7B-Chat Q4 with GPU acceleration
  llm-service:
    image: llm-service:vistral-gpu
    container_name: legalrag-llm
    ports:
      - "8006:8006"
    environment:
      SERVICE_NAME: llm-service
      SERVICE_PORT: 8006
      MODEL_NAME: ggml-vistral-7B-chat-q4_0.gguf
      MODEL_PATH: /app/models/ggml-vistral-7B-chat-q4_0.gguf
      MODEL_CACHE_DIR: /app/models
      N_CTX: 8192
      N_GPU_LAYERS: -1
      N_THREADS: 8
      N_BATCH: 512
      MAX_TOKENS: 2048
      TEMPERATURE: 0.7
      TOP_P: 0.9
      TOP_K: 40
      REPEAT_PENALTY: 1.1
      DEVICE: cuda
      USE_MMAP: "true"
      USE_MLOCK: "false"
      VERBOSE: "false"
      LOG_LEVEL: INFO
    volumes:
      - ./llm-service/models:/app/models
    networks:
      - legalrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Query Service - RAG orchestrator (Q&A, USER-facing)
  query-service:
    build:
      context: ./query-service
      dockerfile: Dockerfile
    container_name: legalrag-query
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: query-service
      SERVICE_PORT: 8002
      EMBEDDING_SERVICE_URL: http://embedding-service:8011
      VECTOR_SERVICE_URL: http://vector-service:8012
      STORAGE_SERVICE_URL: http://storage-service:8010
      LLM_SERVICE_URL: http://llm-service:8006
      RERANK_SERVICE_URL: http://rerank-service:8013
    depends_on:
      - embedding-service
      - vector-service
      - storage-service
      - llm-service
      - rerank-service
    networks:
      - legalrag-network
    volumes:
      - ./query-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Admin Service - Document management & ingestion
  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    container_name: legalrag-admin
    ports:
      - "8001:8001"
    environment:
      SERVICE_NAME: admin-service
      SERVICE_PORT: 8001
      STORAGE_SERVICE_URL: http://storage-service:8010
      EMBEDDING_SERVICE_URL: http://embedding-service:8011
      VECTOR_SERVICE_URL: http://vector-service:8012
      POSTGRES_HOST: postgres-vector
      POSTGRES_PORT: 5432
      POSTGRES_USER: legalrag
      POSTGRES_PASSWORD: legalrag123
      POSTGRES_DB: legalrag
    depends_on:
      - storage-service
      - embedding-service
      - vector-service
      - postgres-vector
    networks:
      - legalrag-network
    volumes:
      - ./admin-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Identifill Service - CCCD scanning (existing service, no changes)
  identifill-service:
    build:
      context: ./identifill_service
      dockerfile: Dockerfile
    container_name: legalrag-identifill
    ports:
      - "8005:8005"
    environment:
      SERVICE_NAME: identifill-service
      SERVICE_PORT: 8005
    networks:
      - legalrag-network
    volumes:
      - ./identifill_service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend - React application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legalrag-frontend
    ports:
      - "3000:3000"
    environment:
      # API endpoints for each service
      VITE_QUERY_SERVICE_URL: http://localhost:8002
      VITE_ADMIN_SERVICE_URL: http://localhost:8001
      VITE_IDENTIFILL_SERVICE_URL: http://localhost:8005
      VITE_STORAGE_SERVICE_URL: http://localhost:8010
    depends_on:
      - query-service
      - admin-service
      - identifill-service
    networks:
      - legalrag-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  minio_data:
    driver: local
  postgres_data:
    driver: local
  embedding_models:
    driver: local
  llm_models:
    driver: local
  rerank_models:
    driver: local

networks:
  legalrag-network:
    driver: bridge
# ============================================
# PORT MAPPING SUMMARY
# ============================================
# Infrastructure:
#   - MinIO API:       9000
#   - MinIO Console:   9001
#   - PostgreSQL:      5432
#
# Services:
#   - Admin:           8001
#   - Query:           8002
#   - LLM:             8006
#   - Identifill:      8005
#   - Storage:         8010
#   - Embedding:       8011
#   - Vector:          8012
#   - Rerank:          8013
#
# Frontend:
#   - React App:       3000
# ============================================
