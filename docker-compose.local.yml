# ============================================
# LegalRAG - LOCAL MODE (Vistral 7B GPU)
# ============================================
# LLM: Vistral 7B GPU (~6GB VRAM)
# Embedding: GPU (~2GB)
# Rerank: CPU (tiết kiệm VRAM cho LLM)
#
# Yêu cầu: 10GB+ VRAM
# Chạy: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# ============================================

services:
  # Rerank Service - CPU (tiết kiệm VRAM cho LLM)
  rerank-service:
    container_name: legalrag-rerank
    build:
      context: ./rerank-service
      dockerfile: Dockerfile
      target: runtime
    environment:
      SERVICE_NAME: rerank-service
      SERVICE_PORT: 8013
      MODEL_NAME: BAAI/bge-reranker-v2-m3
      MODEL_CACHE_DIR: /app/models
      MODEL_MAX_LENGTH: 1024
      DEVICE: cpu
      BATCH_SIZE: 32
      TOP_K: 5
      API_KEY_ENABLED: "false"
      LOG_LEVEL: INFO
    # No GPU for rerank in local mode
    deploy:
      resources:
        reservations: {}

  # LLM Service - Vistral 7B GPU
  llm-service:
    container_name: legalrag-llm
    ports:
      - "8014:8014"
    environment:
      SERVICE_PORT: "8014"
      LLM_PROVIDER: "local"
      MODEL_NAME: ggml-vistral-7B-chat-q4_0.gguf
      MODEL_PATH: /app/models/ggml-vistral-7B-chat-q4_0.gguf
      MODEL_CACHE_DIR: /app/models
      HF_MODEL_REPO: uonlp/Vistral-7B-Chat-gguf
      HF_MODEL_FILE: ggml-vistral-7B-chat-q4_0.gguf
      N_CTX: 5120
      N_GPU_LAYERS: -1
      N_THREADS: 4
      N_BATCH: 512
      MAX_TOKENS: 1280
      TEMPERATURE: 0.7
      TOP_P: 0.9
      TOP_K: 40
      REPEAT_PENALTY: 1.1
      DEVICE: cuda
      USE_MMAP: "true"
      USE_MLOCK: "false"
      VERBOSE: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
